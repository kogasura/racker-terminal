[package]
name = "racker-terminal"
version = "1.9.5"
description = "縦サイドバー + グループ + お気に入りのターミナル。WSL/PowerShell/cmd を快適に切り替え。"
authors = ["yokubo"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "racker_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.clippy]
# 関数の長さ・複雑度チェック。閾値は clippy.toml 側で設定している。
# どちらも既定では allow なので、ここで warn に上げて有効化する
# （CI では -D warnings によりエラー扱いになる）。
too_many_lines = "warn"      # pedantic
cognitive_complexity = "warn" # nursery

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
which = "7"
thiserror = "2"
parking_lot = "0.12"
dirs = "5"
# file:// リンク (OSC 8) のパース用 (file_link.rs)。
# tauri 本体が既に依存しているので、ビルドへの追加コストはゼロ。
url = "2"
# Claude のプラン利用量 API を叩くためだけに使う (claude_usage.rs)。
# tauri-plugin-updater が既に依存しているので、ビルドへの追加コストは小さい。
# TLS は rustls + ring。`rustls` feature ではなく `rustls-no-provider` を選び、
# 暗号プロバイダを自前で指定している (lib.rs の install_default)。
# 既定の `rustls` feature は aws-lc-rs を引き込み、そのビルドに cmake と C/C++
# ツールチェインが要る。updater が既に ring を使っているので、揃えれば
# ビルド要件が増えない。
# system-proxy は既定で入る機能だが、外すとプロキシ配下の環境で取得できなく
# なるため明示的に残している。charset は UTF-8 しか受けないので落とす。
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "http2",
  "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Job Object で PTY の子孫プロセスを道連れにするために使う (job.rs)。
# tauri が既に同じ版に依存しているので、ビルドへの追加コストはない。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

